<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07090f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <title>Royale — Poker</title>

    <!-- Installable: "Add to Home Screen" launches this with no browser chrome. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <meta name="apple-mobile-web-app-title" content="Royale" />
    <meta name="application-name" content="Royale" />

    <!-- Link previews, so a shared URL doesn't arrive as a bare link. -->
    <meta property="og:title" content="Royale — Poker" />
    <meta
      property="og:description"
      content="No Limit Hold'em, PLO4, Sit &amp; Go and bomb pots, with a GTO trainer. Add to your home screen to play full screen."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="module" crossorigin src="./assets/index-PPRFSJyQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B-PYgG9v.css">
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-hidden="true"></canvas>
      <div id="ui-root"></div>
      <div id="fx-root" aria-hidden="true"></div>
    </div>
    <div id="boot">
      <div class="boot__mark">
        <svg viewBox="0 0 100 100" width="86" height="86" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f5d47a" />
              <stop offset="0.5" stop-color="#c9a227" />
              <stop offset="1" stop-color="#8a6a12" />
            </linearGradient>
          </defs>
          <path
            d="M50 12 L74 36 Q88 50 74 64 Q62 76 50 64 Q38 76 26 64 Q12 50 26 36 Z"
            fill="url(#bg)"
          />
          <path d="M46 62 h8 l4 22 h-16 z" fill="url(#bg)" />
        </svg>
      </div>
      <div class="boot__bar"><i></i></div>
      <div class="boot__label">Shuffling up…</div>
    </div>
    <script>
      // Registered from the page rather than the bundle so an install failure
      // can never keep the app itself from booting.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {
            /* offline play unavailable — the app still runs from the network */
          });
        });
      }
    </script>
  </body>
</html>
